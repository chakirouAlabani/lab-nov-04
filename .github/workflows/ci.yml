name: CI

on:
  push:
    branches: [main, docker-compose-ci]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Check frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build frontend backend
        
  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Sign in to GHCR and publish both images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          frontend_image="$image_prefix-frontend:$GITHUB_SHA"
          backend_image="$image_prefix-backend:$GITHUB_SHA"

          docker build -t "$frontend_image" ./frontend
          docker build -t "$backend_image" ./backend
          docker push "$frontend_image"
          docker push "$backend_image"

  deploy:
    needs: publish
    runs-on: [self-hosted, linux, x64, ec2-deploy]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Deploy the published images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          deploy_dir="$HOME/mern-deploy"
          mkdir -p "$deploy_dir"
          cp compose.deploy.yaml "$deploy_dir/"
          cd "$deploy_dir"

          printf 'FRONTEND_IMAGE=%s-frontend:%s\nBACKEND_IMAGE=%s-backend:%s\n' \
            "$image_prefix" "$GITHUB_SHA" "$image_prefix" "$GITHUB_SHA" > .env

          docker_config="$(mktemp -d)"
          trap 'sudo -n rm -rf -- "$docker_config"' EXIT
          printf '%s' "$GHCR_TOKEN" | sudo -n docker --config "$docker_config" \
            login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

          sudo -n docker --config "$docker_config" compose -f compose.deploy.yaml \
            up -d --pull always --wait --wait-timeout 120
          curl --fail --silent --show-error --retry 5 --retry-all-errors http://localhost/api/