services:
  frontend:
    image: "${FRONTEND_IMAGE:?Set FRONTEND_IMAGE}"
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
        restart: true

  backend:
    image: "${BACKEND_IMAGE:?Set BACKEND_IMAGE}"
    environment:
      PORT: "4000"
      MONGODB_URL: mongodb://mongodb:27017/mern_lab6
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  mongodb:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mongo-data:
